<!DOCTYPE html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Solid SSG CMS</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

    <a href="/site/">← На главную</a>

</body>
</html>
