<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solid SSG CMS · Admin</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    .admin { max-width: 720px; margin: 2rem auto; }
    form { display: grid; gap: 0.75rem; background: var(--card); padding: 1.5rem; border-radius: 8px; }
    input, textarea, select {
      background: var(--bg); color: var(--fg); border: 1px solid #334155;
      padding: 0.5rem; border-radius: 4px; font: inherit;
    }
    textarea { min-height: 160px; font-family: ui-monospace, monospace; }
    button {
      background: var(--accent); color: #0f172a; border: none;
      padding: 0.6rem 1.2rem; border-radius: 4px; font-weight: 600; cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    button.secondary { background: #475569; color: white; }
    .list { margin-top: 2rem; }
    .item {
      background: var(--card); padding: 1rem; border-radius: 6px; margin-bottom: 0.5rem;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    }
    .status { font-size: 0.75rem; padding: 0.15rem 0.4rem; border-radius: 3px; }
    .status.published { background: #166534; }
    .status.draft { background: #854d0e; }
    #log { font-family: monospace; font-size: 0.85rem; color: var(--muted); white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="admin">
    <header>
      <h1>Solid SSG CMS</h1>
      <p>Админ-панель · создание контента + триггер параллельной генерации</p>
      <p>
        <a href="/site/" target="_blank">Открыть сгенерированный сайт</a> ·
        <a href="/api/health" target="_blank">API health</a>
      </p>
    </header>

    <form id="create-form">
      <h2>Новый контент</h2>
      <input name="slug" placeholder="slug (url)" required pattern="[a-z0-9\-]+">
      <input name="title" placeholder="Заголовок" required>
      <select name="kind">
        <option value="post">Post</option>
        <option value="page">Page</option>
        <option value="product">Product</option>
      </select>
      <input name="author" placeholder="Автор" value="admin">
      <input name="tags" placeholder="теги через запятую">
      <textarea name="body" placeholder="Markdown body..." required></textarea>
      <div style="display:flex;gap:0.5rem;">
        <button type="submit">Создать + Опубликовать</button>
        <button type="button" class="secondary" id="btn-build">Запустить Build (параллельно)</button>
      </div>
    </form>

    <div class="list">
      <h2>Контент</h2>
      <div id="content-list">Загрузка…</div>
    </div>

    <h2>Лог</h2>
    <div id="log"></div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    const logEl = document.getElementById("log");
    function log(msg) {
      logEl.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logEl.textContent;
    }

    async function refreshList() {
      try {
        const items = await SolidCMS.list();
        const el = document.getElementById("content-list");
        if (!items.length) {
          el.innerHTML = "<p>Пока пусто</p>";
          return;
        }
        el.innerHTML = items.map(i => `
          <div class="item">
            <div>
              <strong><a href="/site/${i.slug}.html" target="_blank">${i.title}</a></strong>
              <div style="font-size:0.85rem;color:var(--muted)">${i.slug} · ${i.author}</div>
            </div>
            <span class="status ${i.status}">${i.status}</span>
          </div>
        `).join("");
      } catch (e) {
        log("Ошибка списка: " + e.message);
      }
    }

    document.getElementById("create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = {
        slug: fd.get("slug"),
        title: fd.get("title"),
        body: fd.get("body"),
        kind: fd.get("kind"),
        author: fd.get("author") || "admin",
        tags: (fd.get("tags") || "").split(",").map(t => t.trim()).filter(Boolean),
      };
      try {
        log("Создание...");
        const item = await SolidCMS.create(data);
        log(`Создано: ${item.id}`);
        await SolidCMS.publish(item.id);
        log("Опубликовано");
        e.target.reset();
        await refreshList();
      } catch (err) {
        log("Ошибка: " + err.message);
      }
    });

    document.getElementById("btn-build").addEventListener("click", async () => {
      try {
        log("Запуск параллельной генерации...");
        const res = await SolidCMS.build();
        log(`Build OK: ${res.pages} страниц за ${res.duration_ms} мс`);
      } catch (err) {
        log("Build error: " + err.message);
      }
    });

    // Init
    SolidCMS.health().then(h => log("API: " + JSON.stringify(h))).catch(e => log(e.message));
    refreshList();
  </script>
</body>
</html>
