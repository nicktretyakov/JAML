[package]
name = "solid_ssg_cms"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "=1.35.1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "io-util"] }
axum = { version = "=0.6.20", features = ["macros"] }
tower = "=0.4.13"
tower-http = { version = "=0.4.4", features = ["fs", "cors", "trace"] }
hyper = { version = "=0.14.28", features = ["server", "http1", "tcp"] }
rayon = "=1.8.0"
rayon-core = "=1.12.0"
serde = { version = "=1.0.193", features = ["derive"] }
serde_json = "=1.0.108"
pulldown-cmark = "=0.9.3"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
thiserror = "=1.0.50"
anyhow = "=1.0.75"
chrono = { version = "=0.4.31", features = ["serde", "clock"], default-features = false }
uuid = { version = "=1.6.1", features = ["v4", "serde"] }
dashmap = "=5.5.3"
parking_lot = "=0.12.1"
async-trait = "=0.1.74"
getrandom = "=0.2.12"

[[bin]]
name = "solid_ssg_cms"
path = "src/main.rs"
